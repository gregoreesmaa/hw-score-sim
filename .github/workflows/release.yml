name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Test, build, and publish release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hw-score-sim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify pyproject.toml version matches git tag
        if: github.ref_type == 'tag'
        shell: python
        run: |
          import os
          import sys
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]

          if version != expected:
              print(
                  f"Version mismatch: pyproject.toml has {version!r}, "
                  f"but git tag is {tag!r} (expected {expected!r}).",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"Verified version {version} matches tag {tag}.")

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . build twine

      - name: Run full test suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distributions with twine
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses PyPI OIDC Trusted Publishing by default (zero static secrets;
        # configure a Trusted Publisher on PyPI for this repo + `release.yml`
        # + environment `pypi`). To fall back to an API token instead, add a
        # `PYPI_API_TOKEN` repository/environment secret and uncomment below:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
